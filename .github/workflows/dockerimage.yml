name: Docker Image CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: # Enables the "Run workflow" button in the UI

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        version: [ "8.4", "8.5" ]

    name: PHP ${{ matrix.version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push PHP ${{ matrix.version }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.version }}/alpine/fpm
          push: true
          tags: ${{ secrets.DOCKER_USER }}/php:${{ matrix.version }}-fpm-alpine

      - name: Add PHP version to summary
        run: |
          image="${{ secrets.DOCKER_USER }}/php:${{ matrix.version }}-fpm-alpine"
          php_version=$(docker run --rm "$image" php -r 'echo PHP_VERSION;')
          echo "### PHP $php_version" >> "$GITHUB_STEP_SUMMARY"
          echo "Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
